version: '3.8'

services:
  yotrack-plan-mindmap:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4022:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
