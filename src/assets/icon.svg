<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#2563EB" opacity="0.1"/>
  
  <!-- Main board/canvas background -->
  <rect x="80" y="80" width="352" height="352" rx="24" fill="#FFFFFF" stroke="#2563EB" stroke-width="4"/>
  
  <!-- Task cards/nodes -->
  <!-- Top-left card -->
  <rect x="120" y="140" width="120" height="80" rx="12" fill="#FFF6B6" stroke="#FCD34D" stroke-width="2"/>
  <rect x="130" y="155" width="60" height="8" rx="4" fill="#2563EB"/>
  <rect x="130" y="175" width="100" height="6" rx="3" fill="#6B7280"/>
  <rect x="130" y="190" width="40" height="6" rx="3" fill="#9CA3AF"/>
  
  <!-- Top-right card -->
  <rect x="272" y="140" width="120" height="80" rx="12" fill="#ADF0C7" stroke="#34D399" stroke-width="2"/>
  <rect x="282" y="155" width="60" height="8" rx="4" fill="#2563EB"/>
  <rect x="282" y="175" width="100" height="6" rx="3" fill="#6B7280"/>
  <rect x="282" y="190" width="40" height="6" rx="3" fill="#9CA3AF"/>
  
  <!-- Bottom-left card -->
  <rect x="120" y="292" width="120" height="80" rx="12" fill="#DEDAFF" stroke="#A78BFA" stroke-width="2"/>
  <rect x="130" y="307" width="60" height="8" rx="4" fill="#2563EB"/>
  <rect x="130" y="327" width="100" height="6" rx="3" fill="#6B7280"/>
  <rect x="130" y="342" width="40" height="6" rx="3" fill="#9CA3AF"/>
  
  <!-- Bottom-right card -->
  <rect x="272" y="292" width="120" height="80" rx="12" fill="#ADF0C7" stroke="#34D399" stroke-width="2"/>
  <rect x="282" y="307" width="60" height="8" rx="4" fill="#2563EB"/>
  <rect x="282" y="327" width="100" height="6" rx="3" fill="#6B7280"/>
  <rect x="282" y="342" width="40" height="6" rx="3" fill="#9CA3AF"/>
  
  <!-- Connectors/links between cards -->
  <!-- Horizontal connector (dotted) -->
  <line x1="240" y1="180" x2="272" y2="180" stroke="#6B7280" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/>
  
  <!-- Vertical connector (dotted) -->
  <line x1="180" y1="220" x2="180" y2="292" stroke="#6B7280" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/>
  
  <!-- Diagonal connector (solid arrow for dependency) -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2563EB"/>
    </marker>
  </defs>
  <line x1="240" y1="332" x2="272" y2="180" stroke="#2563EB" stroke-width="4" marker-end="url(#arrowhead)" stroke-linecap="round"/>
  
  <!-- YouTrack logo element (simplified checkmark/ticket) -->
  <g transform="translate(380, 380)">
    <rect x="0" y="0" width="40" height="40" rx="8" fill="#2563EB"/>
    <path d="M12 20 L18 26 L28 14" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- Miro logo element (simplified wave) -->
  <g transform="translate(92, 380)">
    <path d="M0 20 Q10 10, 20 20 T40 20" stroke="#FFD02E" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M0 30 Q10 20, 20 30 T40 30" stroke="#FFD02E" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
